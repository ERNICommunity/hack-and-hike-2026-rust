[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
rustflags = [
    "-C",
    "link-arg=-Tlinkall.x",
    "-C",
    "link-arg=-Wl,--no-warn-rwx-segments",
]

[env]
# How many stack frames a panic prints. The default of 10 is mostly used up
# by the panic machinery itself before it reaches application code.
ESP_BACKTRACE_CONFIG_BACKTRACE_FRAMES = "20"

[unstable]
build-std = ["core", "alloc"]

[alias]
# A merged image for address 0x0 that ends with the application. Without
# `--skip-padding` it would be padded to the whole 4 MB flash, and flashing
# it would erase what applications keep above their image (the storage
# capability's record, Face ID's enrollments).
dist = "espflash save-image --chip esp32s3 --release --merge --skip-padding firmware.bin"
