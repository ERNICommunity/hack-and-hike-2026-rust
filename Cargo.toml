[package]
edition = "2024"
name = "hack-and-hike"
version = "0.1.0"

[[bin]]
name = "hack-and-hike"
path = "./src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log = "0.4.27"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "log", "medium-ethernet", "tcp", "udp"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04", "jtag-serial"], default-features = false }
bt-hci = "0.8.0"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = { version = "0.8.0" }
esp-radio = { version = "0.18.0", features = ["ble", "coex", "esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
smoltcp = { version = "0.13.0", default-features = false, features = ["log", "medium-ethernet", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }
trouble-host = { version = "0.6.0", features = ["gatt"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
embedded-graphics = "0.8"
mipidsi = "0.8"
display-interface-spi = "0.5"
embedded-hal-bus = "0.3"
embedded-hal = "1.0"
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
arrayvec = { version = "0.7.8", default-features = false }

[build-dependencies]
slint-build = "1.17.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = false
lto = 'fat'
opt-level = 'z'
