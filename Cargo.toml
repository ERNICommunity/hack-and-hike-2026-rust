[package]
edition = "2024"
name = "hack-and-hike"
version = "0.1.0"

[[bin]]
name = "hack-and-hike"
path = "./src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32s3", "log-04"] }
esp-radio = { version = "0.18.0", default-features = false, features = ["esp32s3", "esp-now", "esp-alloc", "log-04", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log = "0.4.27"
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04", "jtag-serial"], default-features = false }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = { version = "0.8.0" }
critical-section = "1.2.0"
static_cell = "2.1.1"
embedded-graphics = "0.8"
# Rich widgets use floating-point helpers such as round/sin/cos. On our
# `no_std` Xtensa target those methods are supplied by embedded-gui's `libm`
# feature rather than by `std`.
embedded-gui = { version = "=0.2.5", default-features = false, features = ["embedded-graphics", "libm", "macros", "rich-widgets"] }
# `embedded-gui` 0.2.5 declares semver ranges for its host-side KDL tooling.
# Newer 0.2.6 macro/codegen releases require kdl 6.7 / Rust 1.95, while the
# ESP Xtensa toolchain is currently Rust 1.93. Keep the compatible published
# toolchain explicit until the ESP compiler catches up.
embedded-gui-macros = "=0.2.3"
mipidsi = "0.8"
display-interface-spi = "0.5"
embedded-hal-bus = "0.3"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
arrayvec = { version = "0.7.8", default-features = false }

[build-dependencies]
# 0.2.4 still uses kdl 4.7 and has MSRV 1.87. This exact host-side
# constraint also satisfies embedded-gui-macros 0.2.3's `^0.2.3` requirement.
embedded-gui-codegen = "=0.2.4"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = false
lto = 'fat'
opt-level = 3