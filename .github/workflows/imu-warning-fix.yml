name: IMU warning fix

on:
  push:
    branches: [feature/bmm150-imu-fusion]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bmm150-imu-fusion
      - name: Make magnetic correction sample-local
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/imu.rs")
          s = p.read_text()
          s = s.replace("        let mut magnetic_for_fusion: Option<[f32; 3]> = None;\n", "")
          s = s.replace(
              "                    magnetic_for_fusion = None;\n\n                    if let Some(trim) = mag_trim {",
              "                    let mut magnetic_for_fusion: Option<[f32; 3]> = None;\n\n                    if let Some(trim) = mag_trim {",
          )
          p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- src/imu.rs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/imu.rs
          git commit -m "chore: make magnetic correction sample-local"
          git push origin HEAD:feature/bmm150-imu-fusion
