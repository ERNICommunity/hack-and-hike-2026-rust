name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: ESP32-S3 release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore successful-build proof
        id: build-proof
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/firmware-build-ok
          key: ${{ runner.os }}-esp32s3-build-ok-1.93.0.0-proof-v1-${{ hashFiles('src/**', 'build.rs', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'theme.toml') }}

      - name: Reuse successful build result
        if: steps.build-proof.outputs.cache-hit == 'true'
        run: echo "Identical firmware inputs already passed the full ESP32-S3 release build."

      - name: Restore Cargo dependency cache
        if: steps.build-proof.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore Xtensa toolchain
        if: steps.build-proof.outputs.cache-hit != 'true'
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/exports
          key: ${{ runner.os }}-xtensa-esp32s3-1.93.0.0-v1

      - name: Install Xtensa Rust toolchain
        if: steps.build-proof.outputs.cache-hit != 'true' && steps.xtensa-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: "1.93.0.0"
          ldproxy: false

      - name: Activate cached Xtensa toolchain
        if: steps.build-proof.outputs.cache-hit != 'true' && steps.xtensa-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          source "$HOME/exports"
          printf '%s\n' "${PATH//:/$'\n'}" >> "$GITHUB_PATH"
          echo "ESPUP_EXPORT_FILE=$HOME/exports" >> "$GITHUB_ENV"
          if [ -n "${LIBCLANG_PATH:-}" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          fi
          if [ -n "${CLANG_PATH:-}" ]; then
            echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          fi

      - name: Restore release build tree
        if: steps.build-proof.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-esp32s3-release-1.93.0.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp32s3-release-1.93.0.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-esp32s3-target-1.93.0.0-${{ hashFiles('Cargo.lock') }}-

      - name: Build firmware
        if: steps.build-proof.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          cargo build --release
          status=$?
          echo '--- CARGO LOCK BEGIN ---'
          base64 -w0 Cargo.lock
          echo
          echo '--- CARGO LOCK END ---'
          exit $status

      - name: Record successful build
        if: steps.build-proof.outputs.cache-hit != 'true' && success()
        shell: bash
        run: |
          mkdir -p .ci-cache
          printf '%s\n' "$GITHUB_SHA" > .ci-cache/firmware-build-ok

      - name: Save successful-build proof
        if: steps.build-proof.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/firmware-build-ok
          key: ${{ runner.os }}-esp32s3-build-ok-1.93.0.0-proof-v1-${{ hashFiles('src/**', 'build.rs', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'theme.toml') }}
