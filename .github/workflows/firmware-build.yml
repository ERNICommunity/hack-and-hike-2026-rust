name: Firmware Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    name: ESP32-S3 compile and link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore Xtensa toolchain
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/exports
          key: ${{ runner.os }}-xtensa-esp32s3-1.93.0.0-v1

      - name: Install Xtensa Rust toolchain
        if: steps.xtensa-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: "1.93.0.0"
          ldproxy: false

      - name: Activate cached Xtensa toolchain
        if: steps.xtensa-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          source "$HOME/exports"
          printf '%s\n' "${PATH//:/$'\n'}" >> "$GITHUB_PATH"
          echo "ESPUP_EXPORT_FILE=$HOME/exports" >> "$GITHUB_ENV"
          if [ -n "${LIBCLANG_PATH:-}" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          fi
          if [ -n "${CLANG_PATH:-}" ]; then
            echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          fi
          rustup default esp

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # CI only needs to prove that the firmware compiles and links for the
      # real ESP32-S3 target. Avoid the production release profile here:
      # fat LTO + codegen-units=1 adds substantial latency without improving
      # the compile/link validity signal.
      - name: Compile and link firmware
        run: cargo build --locked

      - name: Show compiler cache stats
        if: always()
        run: sccache --show-stats
