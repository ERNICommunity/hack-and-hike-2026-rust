name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build:
    name: ESP32-S3 release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore Xtensa toolchain
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/exports
          key: ${{ runner.os }}-xtensa-esp32s3-1.93.0.0-v2
          restore-keys: |
            ${{ runner.os }}-xtensa-esp32s3-1.93.0.0-v1

      - name: Detect restored Xtensa toolchain
        id: xtensa-present
        shell: bash
        run: |
          if [ -x "$HOME/.rustup/toolchains/esp/bin/rustc" ] && [ -f "$HOME/exports" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Xtensa Rust toolchain
        if: steps.xtensa-present.outputs.present != 'true'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: "1.93.0.0"
          ldproxy: false

      - name: Slim Xtensa toolchain cache
        if: steps.xtensa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Bare-metal cargo/rustc linking does not use the separately bundled
          # GNU Xtensa compiler. Keep Rust + Espressif LLVM/Clang, drop GCC.
          rm -rf "$HOME/.rustup/toolchains/esp/xtensa-esp-elf"

      - name: Activate Xtensa toolchain
        shell: bash
        run: |
          source "$HOME/exports"
          printf '%s\n' "${PATH//:/$'\n'}" >> "$GITHUB_PATH"
          echo "ESPUP_EXPORT_FILE=$HOME/exports" >> "$GITHUB_ENV"
          if [ -n "${LIBCLANG_PATH:-}" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          fi
          if [ -n "${CLANG_PATH:-}" ]; then
            echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          fi
          rustup default esp

      - name: Restore release build tree
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-esp32s3-release-1.93.0.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-v1
          restore-keys: |
            ${{ runner.os }}-esp32s3-target-1.93.0.0-${{ hashFiles('Cargo.lock') }}-

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build firmware
        run: cargo build --locked --release

      - name: Show compiler cache stats
        if: always()
        run: sccache --show-stats
