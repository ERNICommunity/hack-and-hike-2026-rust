name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain version from Cargo.toml
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install host Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy

      - name: Lint the host crates and their tests
        run: |
          host_target="$(rustc +"$RUST_VERSION" -vV | sed -n 's/^host: //p')"
          cargo +"$RUST_VERSION" clippy -p hack-and-hike-core -p hack-and-hike-face -p hack-and-hike-vision --all-targets --target "$host_target" -- -D warnings

      - name: Run host tests
        run: RUSTFLAGS="-D warnings" ./scripts/test.sh

  autoflash:
    name: Autoflash page and server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/autoflash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/autoflash/package-lock.json

      - name: Install the page's dependencies
        run: npm ci

      - name: Test the page
        run: npm test

      # site/ is committed and build.rs embeds it into the server, so the page
      # that flashes boards is a build artefact in git. If it no longer matches
      # the sources beside it, the sources are not what anyone is running.
      - name: Check that the committed site/ still matches its sources
        run: |
          npm run build:selfhost
          git diff --exit-code -- site/

      # The server is its own Cargo workspace. It is built with the repository's
      # toolchain, like every other Rust job here.
      - name: Read the toolchain version from the root Cargo.toml
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' ../../Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install host Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy

      - name: Lint and test the server
        run: |
          cargo +"$RUST_VERSION" clippy --locked --all-targets -- -D warnings
          cargo +"$RUST_VERSION" test --locked

  firmware:
    name: Firmware lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read the toolchain version from Cargo.toml
        run: echo "RUST_VERSION=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          # The Xtensa toolchain adds a fourth version component.
          version: ${{ env.RUST_VERSION }}.0
          ldproxy: false

      - name: Cache Cargo registry and build tree
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (library and every application binary)
        run: cargo clippy --locked --release -- -D warnings

      - name: Build every application binary
        run: cargo build --locked --release
