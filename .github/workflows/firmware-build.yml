name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HOST_RUST_VERSION: "1.97.0"
  XTENSA_RUST_VERSION: "1.97.0.0"

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install host Rust toolchain
        run: rustup toolchain install "$HOST_RUST_VERSION" --profile minimal

      - name: Run host tests
        run: |
          set -euo pipefail
          # The workspace .cargo/config.toml targets the ESP32-S3; override it
          # with the host triple for these host-only packages.
          host_target="$(rustc +"$HOST_RUST_VERSION" -vV | sed -n 's/^host: //p')"
          for package in tests/imu_regression tests/network_regression; do
            RUSTFLAGS="-D warnings" cargo +"$HOST_RUST_VERSION" test \
              --manifest-path "$package/Cargo.toml" \
              --target "$host_target"
          done

  firmware:
    name: Firmware lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: ${{ env.XTENSA_RUST_VERSION }}
          ldproxy: false

      - name: Cache Cargo registry and build tree
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (library and every application binary)
        run: cargo clippy --locked --release -- -D warnings

      - name: Build every application binary
        run: cargo build --locked --release
