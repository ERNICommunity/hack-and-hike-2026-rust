name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: ESP32-S3 release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: Restore Xtensa toolchain
        id: xtensa-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/exports
          key: ${{ runner.os }}-xtensa-esp32s3-1.93.0.0-v1

      - name: Install Xtensa Rust toolchain
        if: steps.xtensa-cache.outputs.cache-hit != 'true'
        uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: true
          buildtargets: esp32s3
          version: "1.93.0.0"
          ldproxy: false

      - name: Activate cached Xtensa toolchain
        if: steps.xtensa-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          source "$HOME/exports"
          printf '%s\n' "${PATH//:/$'\n'}" >> "$GITHUB_PATH"
          echo "ESPUP_EXPORT_FILE=$HOME/exports" >> "$GITHUB_ENV"
          if [ -n "${LIBCLANG_PATH:-}" ]; then
            echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          fi
          if [ -n "${CLANG_PATH:-}" ]; then
            echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
          fi

      # GitHub checkout gives every file a fresh mtime. Cargo uses mtimes in
      # fingerprints, so that would force the local firmware crate to rebuild
      # even when an exact build-tree cache is restored. Normalize tracked file
      # mtimes to the checked-out commit time before restoring target/.
      - name: Normalize source mtimes
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          git ls-files -z | xargs -0 touch -d "@$SOURCE_DATE_EPOCH"

      - name: Restore release build tree
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-esp32s3-release-1.93.0.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp32s3-release-1.93.0.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            ${{ runner.os }}-esp32s3-target-1.93.0.0-${{ hashFiles('Cargo.lock') }}-

      - name: Build firmware
        run: cargo build --locked --release
