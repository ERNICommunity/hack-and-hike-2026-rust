name: IMU fusion fixup

on:
  push:
    branches: [feature/bmm150-imu-fusion]

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bmm150-imu-fusion

      - name: Apply reviewed fusion fixups
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/imu.rs")
          text = path.read_text()

          text = text.replace(
              "                    let corrected_gyro = gyro_bias.correct(sample.accel_g, sample.gyro_dps);\n\n                    if let Some(trim) = mag_trim {",
              "                    let corrected_gyro = gyro_bias.correct(sample.accel_g, sample.gyro_dps);\n                    // Yaw correction is intentionally single-shot per fresh 30 Hz\n                    // BMM150 frame; the 100 Hz fusion ticks between frames are gyro-only.\n                    magnetic_for_fusion = None;\n\n                    if let Some(trim) = mag_trim {",
          )

          text = text.replace(
              "                                    mag_calibration.observe(body_field);\n                                    let corrected_field = mag_calibration.apply(body_field);",
              "                                    // Once calibrated, do not let an abnormal external\n                                    // magnetic field move the learned extrema.\n                                    if !mag_calibration.is_ready()\n                                        || (bmm150::GOOD_FIELD_MIN_UT..=bmm150::GOOD_FIELD_MAX_UT)\n                                            .contains(&mag.field_strength_ut)\n                                    {\n                                        mag_calibration.observe(body_field);\n                                    }\n                                    let corrected_field = mag_calibration.apply(body_field);",
          )

          text = text.replace(
              "    let mut x = wrap_radians(value);\n    let mut sign = 1.0;\n    if x > PI * 0.5 {\n        x = PI - x;\n    } else if x < -PI * 0.5 {\n        x = -PI - x;\n        sign = -1.0;\n    }\n\n    let x2 = x * x;\n    sign * x * (1.0 - x2 / 6.0 + x2 * x2 / 120.0 - x2 * x2 * x2 / 5040.0)",
              "    let mut x = wrap_radians(value);\n    if x > PI * 0.5 {\n        x = PI - x;\n    } else if x < -PI * 0.5 {\n        x = -PI - x;\n    }\n\n    let x2 = x * x;\n    x * (1.0 - x2 / 6.0 + x2 * x2 / 120.0 - x2 * x2 * x2 / 5040.0)",
          )

          path.write_text(text)

      - name: Commit fixups
        shell: bash
        run: |
          if git diff --quiet -- src/imu.rs; then
            echo "Fixups already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/imu.rs
          git commit -m "fix: gate magnetic yaw correction to fresh samples"
          git push origin HEAD:feature/bmm150-imu-fusion
