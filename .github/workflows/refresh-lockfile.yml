name: Refresh lockfile

on:
  push:
    branches: [runtime/foundation-hygiene]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: runtime/foundation-hygiene

      - name: Refresh Cargo.lock from manifests
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo metadata --format-version=1 > /dev/null

      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh lockfile after dependency cleanup"
          git push origin HEAD:runtime/foundation-hygiene
