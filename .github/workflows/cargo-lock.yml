name: Refresh Cargo.lock

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Cargo.toml

# This workflow is the only CI path allowed to write dependency resolution
# back to a PR branch. The normal firmware build remains read-only and locked.
permissions:
  contents: write

concurrency:
  group: cargo-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    # Fork PRs keep the normal read-only validation path. A bot-authored
    # Cargo.lock commit retriggers the PR event, so skip that second pass.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Resolve dependency changes
        # Full metadata resolution is required here. `--no-deps` does not prune
        # packages that became unreachable after a manifest dependency removal,
        # so it can leave a lockfile that later fails `cargo build --locked`.
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify resolver scope
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- . ':(exclude)Cargo.lock'; then
            echo '::error::Cargo resolution modified tracked files other than Cargo.lock'
            git status --short
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo '::error::Cargo resolution created unexpected untracked files'
            printf '%s\n' "$untracked"
            exit 1
          fi

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: refresh Cargo.lock'
          git push origin "HEAD:${PR_HEAD_REF}"
